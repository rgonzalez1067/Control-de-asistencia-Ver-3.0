# =============================================================================
# nginx-ssl.conf — Reverse proxy + SSL para MegaSoft Asistencia
# Los certificados se montan como volumen desde el host en /etc/nginx/ssl
# =============================================================================

# Redirección HTTP → HTTPS (siempre)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    server_name _;

    # ── Certificados SSL ──────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── Configuración SSL (Mozilla "Intermediate" — compatible con TLS 1.2+) ──
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP Stapling — mejora el rendimiento de la validación del certificado
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security Headers ──────────────────────────────────────────────
    # HSTS: fuerza HTTPS por 1 año incluyendo subdominios
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    # Previene MIME-type sniffing (ej. un .txt siendo ejecutado como .js)
    add_header X-Content-Type-Options     "nosniff" always;
    # Evita clickjacking (la app no puede ser embebida en iframes externos)
    add_header X-Frame-Options            "DENY" always;
    # Controla qué información se envía en el Referer
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    # Deshabilita funcionalidades del navegador que la app no usa (Privacy)
    add_header Permissions-Policy         "camera=(self), microphone=(), geolocation=(), payment=()" always;
    # Content Security Policy: limita el origen de scripts, estilos y recursos
    # Ajustar si se cargan recursos desde CDN externos (face-api weights, Google Fonts, etc.)
    #add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none';" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none';" always;
    # Oculta la versión de nginx del header Server (minimiza fingerprinting)
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Configuración general ─────────────────────────────────────────
    client_max_body_size 25M;

    # Compresión de respuestas (mejora rendimiento)
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    application/x-javascript text/xml application/xml
                    image/svg+xml application/manifest+json;

    # ── Bloquear listado de directorios ──────────────────────────────
    # Evita que nginx exponga el árbol de archivos si no hay index.html
    autoindex off;

    # ── Bloquear acceso a archivos ocultos (ej. .env, .git, .htaccess) ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Bloquear acceso a archivos de configuración sensibles ─────────
    location ~* \.(env|toml|yml|yaml|lock|log|md|sh|py|cfg|ini|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Proxy API → Backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts seguros: evita que conexiones lentas o colgadas acaparen workers
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     90s;

        # Limitar métodos HTTP aceptados (solo los que usa la app)
        limit_except GET POST PUT PATCH DELETE OPTIONS {
            deny all;
        }
    }

    # ── SPA fallback (React Router) ───────────────────────────────────
    location / {
        try_files $uri /index.html;

        # Cache para assets estáticos con fingerprint (Webpack chunkhash)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
